; TLE9879-2QXA40 — PlatformIO build for the root Makefile
;
;   make                # pio run -e hall   (safe hello-world blink)
;   make ENV=spin       # pio run -e spin   (legacy open-loop six-step drive)
;   make ENV=debug      # debug build
;
; Uses the custom local platform: ~/.platformio/platforms/tle987x
; (bare-metal arm-none-eabi-gcc + J-Link, no framework).

[platformio]
default_envs = hall

[env]
platform = tle987x
board = tle9879_2qxa40
; The tle987x platform builder does not process ini build flags itself, so the
; linker script is attached from scripts/ldscript.py (extra_scripts) instead.
extra_scripts = scripts/ldscript.py
upload_protocol = jlink

; Phase C: Hall-locked BC — source not in this tree yet. Currently builds the
; safe hello-world blink (src/main.c). Drop in src/hall_*.c and flip the filter.
[env:hall]
build_src_filter = +<*> -<motor.c>

; Phase B: continuous one-sector hold — source not in this tree yet.
; Same placeholder as hall for now.
[env:hold]
build_src_filter = +<*> -<motor.c>

; Legacy open-loop six-step drive (src/motor.c). Enables the bridge — see the
; CURRENT SAFETY notes at the top of motor.c before powering the bus.
[env:spin]
build_src_filter = +<*> -<main.c>

[env:debug]
build_type = debug
build_flags = -Og -g3 -DDEBUG
build_src_filter = +<*> -<motor.c>
